/* ============================================================================================
   CONTENIDO (datos puros: sirve también como versión de texto si WebGL o el CDN no están disponibles)
   ============================================================================================ */
const STEPS = [
  { id:'intro', kicker:'Visión general', title:'El caso: consultar un trámite',
    text:`<p>Un ciudadano escribe el número de su trámite y ve en qué estado va. La aplicación es mínima (una API en Go de un solo archivo): lo que se diseñó con cuidado es la <b>plataforma</b> que la entrega, para que sea <b>segura, inmutable, barata y automatizada</b>.</p><p>Sigue el recorrido de un cambio: de tu laptop hasta el ciudadano, pasando por las puertas que impiden que algo inseguro llegue.</p>`,
    why:`<p>Los equipos (Go, Python, React) quieren desplegar sin pedirle ayuda a DevOps cada vez. Eso solo es sostenible si el camino seguro es también el camino fácil.</p>`,
    files:['README.md','app/main.go'], cmd:`curl -s https://<url-del-servicio>/health`,
    quiz:{q:'¿Qué se evalúa principalmente en este proyecto?', o:['La complejidad de la aplicación','La plataforma que la entrega','El diseño del frontend'], a:1, why:'La app es deliberadamente simple. Lo que importa es cómo se construye, protege y despliega.'} },

  { id:'laptop', kicker:'Tu laptop · primera barrera', title:'Un secreto no llega a existir en Git',
    text:`<p>Antes de que un commit exista, <b>pre-commit</b> ejecuta hooks: <b>gitleaks</b> busca secretos y otros hooks bloquean <code>.env</code>, <code>*.tfstate</code>, llaves privadas y llaves de service accounts de GCP, <b>por nombre y por contenido</b>. También se valida el nombre de la rama y el formato Conventional Commits, y <code>pre-push</code> escanea lo que estás por subir.</p>`,
    why:`<p>Defensa en capas: lo más barato es detener el secreto antes de que salga de tu máquina. Pero un hook local se puede saltar con <code>--no-verify</code> o no estar instalado. Por eso existe otra barrera en CI.</p>`,
    files:['.pre-commit-config.yaml','.gitleaks.toml','scripts/setup-dev.sh','scripts/test-secret-hooks.sh'], cmd:`./scripts/test-secret-hooks.sh`,
    quiz:{q:'¿Por qué los mismos hooks corren también en CI?', o:['Porque el hook local puede no estar instalado o saltarse con --no-verify','Para que el pipeline sea más lento','Porque GitHub lo exige'], a:0, why:'CI es la barrera real: un hook local es una comodidad, no una garantía.'} },

  { id:'github', kicker:'GitHub · pull request', title:'main está protegida',
    text:`<p>Trunk-based: ramas cortas <code>feature/DEVOPS-NN-…</code>, commits Conventional Commits y <b>todo entra por pull request</b>. La rama <code>main</code> exige cuatro checks en verde (<code>app</code>, <code>docker</code>, <code>security</code>, <code>terraform</code>), prohíbe el force-push y la regla aplica también a administradores.</p>`,
    why:`<p>El repositorio es público: la protección de ramas funciona sin plan de pago y los evaluadores pueden leerlo. Por eso la barrera de secretos es obligatoria, no opcional.</p>`,
    files:['.github/pull_request_template.md','.github/workflows/ci.yml'], cmd:`gh api repos/<owner>/<repo>/branches/main/protection --jq '.required_status_checks.contexts'`,
    quiz:{q:'¿Qué ocurre si uno de los checks de un PR está en rojo?', o:['No se puede fusionar','Se fusiona igual si eres administrador','Se fusiona tras 24 horas'], a:0, why:'La regla incluye a los administradores (enforce_admins).'} },

  { id:'ci', kicker:'GitHub Actions · pull_request', title:'CI: cuatro checks y cero credenciales',
    text:`<p><code>app</code>: gofmt, vet y tests con <code>-race</code>. <code>docker</code>: hadolint, build y escaneo Trivy (falla en CRITICAL). <code>security</code>: los mismos hooks, gitleaks sobre todo el historial y una prueba de que la barrera bloquea secretos falsos. <code>terraform</code>: <code>fmt</code> y <code>validate</code>.</p>`,
    why:`<p>CI no tiene credenciales de GCP y solo lee el repositorio: aunque alguien manipule un workflow en un PR, no puede tocar la nube. Las acciones de terceros están fijadas por SHA, no por tag.</p>`,
    files:['.github/workflows/ci.yml','scripts/test-secret-hooks.sh'], cmd:`gh pr checks --watch`,
    quiz:{q:'¿Tiene el CI credenciales de Google Cloud?', o:['Sí, una llave JSON','No: solo lee el repositorio','Sí, un token de larga vida'], a:1, why:'Sin credenciales, el CI no puede dañar la nube aunque se manipule.'} },

  { id:'wif', kicker:'Autenticación · Workload Identity Federation', title:'Despliegue sin llaves (OIDC)',
    text:`<p>Al fusionar a <code>main</code>, el workflow de deploy pide a GitHub un <b>token OIDC</b> de pocos minutos. <b>Workload Identity Federation</b> lo cambia por credenciales temporales de <code>sa-deployer</code>, pero solo si el token viene de <b>este repositorio</b> y de la rama <code>main</code>.</p>`,
    why:`<p>Se descartó guardar una llave JSON en GitHub Secrets: es una credencial de larga vida que puede filtrarse. Aquí no hay nada permanente que robar.</p>`,
    files:['infra/platform/wif.tf','.github/workflows/deploy.yml'], cmd:`gcloud iam workload-identity-pools providers describe github-provider --workload-identity-pool=github-pool --location=global --format='value(attributeCondition)'`,
    quiz:{q:'Otro repositorio de GitHub intenta usar este provider. ¿Qué ocurre?', o:['Lo rechaza la attribute_condition','Funciona: GitHub es de confianza','Pide una contraseña'], a:0, why:'La condición exige repositorio y rama exactos.'} },

  { id:'ar', kicker:'Artifact Registry', title:'Una imagen que no se puede mover',
    text:`<p>El pipeline construye la imagen (multistage, usuario no-root, ~9 MB), la sube con el <b>SHA del commit</b> como tag y lee su <b>digest</b> (<code>sha256:…</code>). El repositorio tiene <b>tags inmutables</b>: un tag no puede reasignarse a otra imagen.</p>`,
    why:`<p>Se despliega por digest, no por tag ni <code>:latest</code>: el digest identifica los bytes exactos. Trade-off conocido: con tags inmutables la limpieza automática no puede borrar imágenes con tag; cuesta centavos.</p>`,
    files:['app/Dockerfile','infra/platform/artifact_registry.tf'], cmd:`gcloud artifacts docker images list us-central1-docker.pkg.dev/<project_id>/tramites/tramites-api --include-tags`,
    quiz:{q:'¿Qué identifica exactamente a una imagen?', o:['Su tag','Su digest sha256','Su nombre'], a:1, why:'El tag es una etiqueta; el digest es la huella de los bytes.'} },

  { id:'kms', kicker:'Cloud KMS · atestación', title:'Firmar el digest',
    text:`<p>El pipeline pide a <b>Cloud KMS</b> que firme el digest con una llave asimétrica (ECDSA P-256). El resultado es una <b>atestación</b>: la prueba de que <i>este pipeline</i> construyó <i>esos bytes</i>. La llave privada nunca sale de KMS: <code>sa-deployer</code> puede pedir firmas, no leer la llave.</p>`,
    why:`<p>Firmar el digest (no el tag) hace la firma inseparable de la imagen. Si alguien roba el pipeline, no se lleva la llave.</p>`,
    files:['.github/workflows/deploy.yml','infra/platform/binauthz.tf'], cmd:`gcloud container binauthz attestations list --attestor=projects/<project_id>/attestors/pipeline-attestor --artifact-url=<imagen>@<digest>`,
    quiz:{q:'¿Qué se firma?', o:['El tag','El digest','El nombre del repositorio'], a:1, why:'Un tag puede apuntar a otra cosa mañana; un digest no.'} },

  { id:'gate', kicker:'Binary Authorization · política de admisión', title:'La puerta que solo abre con firma',
    text:`<p>La política del proyecto exige que <b>toda</b> imagen tenga una atestación válida de <code>pipeline-attestor</code> (<code>REQUIRE_ATTESTATION</code>, <code>ENFORCED_BLOCK_AND_AUDIT_LOG</code>). Cloud Run la verifica al <b>crear cada revisión</b>. La imagen firmada pasa y el despliegue por digest continúa.</p>`,
    why:`<p>No hay lista de excepciones. Se activó en dos tiempos en lugar de dejar una excepción permanente para la imagen inicial: una excepción permanente es un hueco.</p>`,
    files:['infra/platform/binauthz.tf'], cmd:`gcloud container binauthz policy export`,
    quiz:{q:'¿Cuándo verifica Cloud Run la política?', o:['Al crear cada revisión','Solo la primera vez','Cada hora'], a:0, why:'Cada revisión nueva debe pasar por la puerta.'} },

  { id:'reject', kicker:'Parte B · la prueba', title:'El rechazo de una imagen sin firmar',
    text:`<p>Una imagen subida a mano, sin atestación, llega a la puerta y es <b>rechazada</b>: <code>denied by attestor … No attestations found that were valid and signed by a key trusted by the attestor</code>. El servicio sigue sirviendo la revisión anterior.</p>`,
    why:`<p>La denegación queda como evento de auditoría de Cloud Run. Existe el <i>break-glass</i> (<code>--breakglass</code>) para emergencias: también queda auditado, pero cualquier identidad que pueda actualizar el servicio podría usarlo; cerrarlo exige una política de organización.</p>`,
    files:['scripts/demo-binauthz-reject.sh','docs/evidencias/binauthz-rechazo.txt'], cmd:`./scripts/demo-binauthz-reject.sh`,
    quiz:{q:'Una imagen sin firmar intenta desplegarse. ¿Qué pasa con el tráfico actual?', o:['Se interrumpe','Sigue en la última revisión buena','Se divide 50/50'], a:1, why:'La revisión nueva falla al crearse y nunca recibe tráfico.'} },

  { id:'run', kicker:'Cloud Run', title:'Pagas solo por lo que usas',
    text:`<p><code>tramites-api</code> escala de <b>0 a 3 instancias</b> (1 vCPU, 512 Mi, CPU solo durante las solicitudes). Sin tráfico hay 0 instancias y el costo es ≈ 0. Tras cada despliegue, un <b>smoke test</b> llama a <code>/health</code> y comprueba estado, secreto y versión.</p>`,
    why:`<p>El máximo de 3 instancias es el <b>tope duro</b> de gasto. Terraform es dueño de la plataforma y el pipeline solo cambia la imagen (<code>ignore_changes</code>): no se pisan.</p>`,
    files:['infra/platform/cloud_run.tf','.github/workflows/deploy.yml'], cmd:`gcloud run revisions list --service tramites-api --region us-central1`,
    quiz:{q:'¿Cuál es el tope duro de gasto del servicio?', o:['El presupuesto de USD 10','max_instance_count = 3','No hay tope'], a:1, why:'El presupuesto solo avisa; el máximo de instancias limita de verdad.'} },

  { id:'secret', kicker:'Secret Manager', title:'El secreto nunca viaja con el código',
    text:`<p><code>API_KEY</code> vive en <b>Secret Manager</b> (<code>api-key</code>). Terraform crea solo el <i>contenedor</i> del secreto y el permiso; el valor se carga con <code>gcloud secrets versions add</code>. Cloud Run lo inyecta al arrancar la instancia y la API solo informa <code>secret_configured: true</code>: <b>nunca</b> lo devuelve ni lo registra.</p>`,
    why:`<p>Si el valor pasara por Terraform quedaría en texto plano en el estado. La versión está fijada (no <code>latest</code>) para que rotarlo sea un cambio explícito y revisable.</p>`,
    files:['infra/platform/secrets.tf','app/main.go'], cmd:`gcloud secrets versions list api-key`,
    quiz:{q:'¿Dónde está el valor de API_KEY?', o:['En el repositorio','En el estado de Terraform','Solo en Secret Manager'], a:2, why:'En ningún otro lugar: ni repo, ni estado, ni logs.'} },

  { id:'iam', kicker:'IAM', title:'Mínimo privilegio',
    text:`<p>Una cuenta de servicio por responsabilidad. <code>sa-runtime</code> solo lee <b>un</b> secreto. <code>sa-deployer</code> escribe en <b>un</b> repositorio, despliega <b>un</b> servicio, actúa como <b>una</b> cuenta y firma con <b>una</b> llave. Único permiso a nivel de proyecto: crear atestaciones (no admiten permisos por recurso).</p>`,
    why:`<p>Ninguna cuenta tiene <code>editor</code> ni <code>owner</code>. Y la condición de WIF limita quién puede llegar a ser <code>sa-deployer</code>: este repositorio y esta rama.</p>`,
    files:['infra/platform/iam.tf','README.md'], cmd:`gcloud projects get-iam-policy <project_id> --flatten='bindings[].members' --filter='bindings.members:sa-deployer' --format='value(bindings.role)'`,
    quiz:{q:'¿Qué cuenta puede leer el secreto api-key?', o:['sa-deployer','sa-runtime','Las dos'], a:1, why:'Solo sa-runtime tiene secretAccessor, y solo sobre ese secreto.'} },

  { id:'tf', kicker:'Infraestructura como código', title:'Terraform en dos capas',
    text:`<p>El <b>bootstrap</b> (estado local) crea el bucket de estado versionado, habilita las APIs y define el presupuesto. La <b>plataforma</b> guarda su estado en ese bucket. Se aplica desde la estación de trabajo; CI solo hace <code>fmt</code> y <code>validate</code>.</p>`,
    why:`<p>Resuelve el huevo y la gallina: el bucket del estado no puede guardar el estado de su propia creación. Aplicar desde CI exigiría darle permisos de Owner a una cuenta de CI; queda como pendiente.</p>`,
    files:['infra/bootstrap/main.tf','infra/platform/backend.tf'], cmd:`terraform -chdir=infra/platform state list`,
    quiz:{q:'¿Por qué existe un bootstrap separado?', o:['Para ahorrar costos','El bucket del estado no puede guardar el estado de su propia creación','Por orden visual'], a:1, why:'Es el problema del huevo y la gallina del backend remoto.'} },

  { id:'cost', kicker:'Presupuesto', title:'Costos: avisar no es frenar',
    text:`<p>Presupuesto de USD 10 con alertas al 50 %, 90 % y 100 % del gasto real y al 100 % del <b>pronóstico</b>. Un presupuesto <b>avisa, no corta</b> el gasto: el freno real es <code>max_instance_count</code>. Casi todo cae en la capa gratuita; KMS y el almacenamiento son centavos.</p>`,

function mat(color,o={}){

    emissive:o.emissive??0x000000, emissiveIntensity:o.ei??1,

}

const sph  = (r,c,o)=>mesh(new THREE.SphereGeometry(r,20,14),c,o);
const tor  = (r,t,c,o,arc=Math.PI*2)=>mesh(new THREE.TorusGeometry(r,t,12,48,arc),c,o);
const outline = (m,color,op=0.9)=>new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
const place = (o,x,y,z)=>{o.position.set(x,y,z);return o;};

/* ---------- plataformas (islas) ---------- */
function platform(group,name,cx,cz,w,d,color){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const slab=box(w,0.8,d,0x0f1730,{rough:.85,metal:.1}); slab.position.y=-0.4; g.add(slab);
  const e=outline(slab,color,.85); e.position.copy(slab.position); g.add(e);
  const pts=[]; const hw=w/2, hd=d/2;
  for(let x=-hw+2;x<hw;x+=2) pts.push(x,0.03,-hd,x,0.03,hd);
  for(let z=-hd+2;z<hd;z+=2) pts.push(-hw,0.03,z,hw,0.03,z);
  const gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  g.add(new THREE.LineSegments(gg,new THREE.LineBasicMaterial({color,transparent:true,opacity:.13})));
  scene.add(g);
  label(group,name,[cx,0.4,cz+d/2],{cls:'zone',kind:'zone',color});
  return g;
}

}
function makeContainer(color){

function makeVault(color){

function makeGate(color){          // arco que se cruza a lo largo de X

function makeGear(color){

function makeBeam(color){
  const geo=new THREE.BufferGeometry().setFromPoints([V(),V(0,0,1)]);

}

function route(points){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>V(...p)),false,'centripetal');
  const cum=[0]; for(let i=1;i<points.length;i++) cum.push(cum[i-1]+V(...points[i]).distanceTo(V(...points[i-1])));
  const frac=cum.map(c=>c/cum[cum.length-1]);
  return {at:(u,out)=>curve.getPointAt(clamp01(u),out||V()), frac};
}

  O.iamBeams.forEach((b,i)=>{ const on=k>.8+i*1.7; b.line.visible=on; b.dot.visible=on; b.lbl.on=on; if(on) beamDot(b,((k*.35+i*.17)%1)); });
} };

BEH.tf={ cam:view([38,2,33],[38,15,51]), focus:['tf'], L:15, tick(t){
  const k=t%this.L;
  O.bucket.scale.y=ease(seg(k,.8,2.2))||.001; O.bucket.position.y=1.7*O.bucket.scale.y;
  const b1=k>.4&&k<3.4; O.tfBeam1.line.visible=b1; O.tfBeam1.dot.visible=b1; if(b1) beamDot(O.tfBeam1,((k-.4)/2)%1);
  showPop(O.pTf1,k>.8&&k<5);
  O.tfBeam2.line.visible=k>5; O.tfBeam2.dot.visible=k>5&&k<8; O.stateDoc.visible=k>5&&k<8.2;
  if(k>5){ const u=ease(seg(k,5,7.6)); O.stateDoc.position.set(lerp(49,40.8,u),lerp(3,2,u),31); beamDot(O.tfBeam2,u); }
  O.layers.forEach((l,i)=>{ l.visible=k>7.2+i*.9; });
  showPop(O.pTf2,k>7.4&&k<11.6); showPop(O.pTf3,k>11.4);
} };

BEH.cost={ cam:view([38,3,38],[38,12,58]), focus:['cost'], L:15, tick(t){
  const k=t%this.L; let p=0;
  if(k<1) p=0; else if(k<3) p=.5*ease(seg(k,1,3)); else if(k<5) p=.5; else if(k<6.4) p=lerp(.5,.9,ease(seg(k,5,6.4))); else if(k<8) p=.9; else if(k<9) p=lerp(.9,1,ease(seg(k,8,9))); else p=1;
  O.needlePivot.rotation.z=Math.PI*(1-p);
  O.bell.visible=k>2.6; O.bell.rotation.z=(k>2.6&&k<12)?Math.sin(t*14)*.3:0;
  showPop(O.pCost1,k>2.8&&k<5.4); showPop(O.pCost2,k>6&&k<8.4); showPop(O.pCost3,k>8.8&&k<12.4); showPop(O.pCost4,k>12.2);
} };

BEH.end={ cam:view([16,0,6],[14,80,112]), focus:['zones','end'], L:20, tick(t){
  const k=(t%this.L)/this.L; const p=R_ALL.at(k); hero.visible=true; hero.position.copy(p); hero.scale.setScalar(3); O.seal.visible=k>R_ALL.frac[10];
} };

/* ============================================================================================
   NAVEGACIÓN, CÁMARA Y PANEL
   ============================================================================================ */
let cur=-1, stepT=0, time=0, auto=false, autoT=0, focus=new Set(['zones']);
const camPos=V(14,80,112), camLook=V(16,0,6), tgtPos=V(), tgtLook=V();
let yaw=0,pitch=0,zoom=1, userMoved=false;
let snap=true; // salto instantáneo de cámara en el primer paso o con movimiento reducido

function viewOffset(){
  const W=innerWidth,H=innerHeight; const hidden=$('panel').classList.contains('off');
  let x=0,y=0;
  if(!hidden){ if(innerWidth>820) x=Math.min(430,innerWidth*.4)/2; else y=Math.min(innerHeight*.44,330)/2; }
  camera.setViewOffset(W,H,x,y,W,H);
}
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; viewOffset(); camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

function buildPanel(i){
  const s=STEPS[i];
  $('kicker').textContent=`${i+1}. ${s.kicker}`; $('title').textContent=s.title;
  $('text').innerHTML=s.text; $('why').innerHTML=s.why;
  $('files').innerHTML=s.files.map(f=>`<span class="chip">${f}</span>`).join('');
  $('cmd').textContent=s.cmd; $('copy').textContent='Copiar';
  $('scoreSec').hidden=true;
  const q=s.quiz; $('quizSec').hidden=!q;
  if(q){
    $('qq').textContent=q.q; $('fb').textContent='';
    $('opts').innerHTML=''; q.o.forEach((txt,ix)=>{ const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=txt; b.onclick=()=>answer(i,ix); $('opts').appendChild(b); });
    if(answers[i]!==null) markAnswer(i);
  }
  if(i===STEPS.length-1){
    const total=STEPS.filter(s=>s.quiz).length, ok=STEPS.reduce((n,s,ix)=>n+(s.quiz&&answers[ix]===s.quiz.a?1:0),0), done=answers.filter(a=>a!==null).length;
    $('scoreSec').hidden=false;
    $('score').innerHTML=done?`Acertaste <b>${ok}</b> de <b>${total}</b> preguntas (${done} respondidas).`:'Aún no respondiste ninguna pregunta: vuelve atrás y pruébate.';
  }
  $('panel').scrollTop=0;
}
function answer(i,ix){ if(answers[i]!==null) return; answers[i]=ix; markAnswer(i); }
function markAnswer(i){
  const q=STEPS[i].quiz; const chosen=answers[i];
  [...$('opts').children].forEach((b,ix)=>{ b.disabled=true; if(ix===q.a) b.classList.add('ok'); else if(ix===chosen) b.classList.add('bad'); });
  $('fb').innerHTML=(chosen===q.a?'✔ Correcto. ':'✗ No exactamente. ')+q.why;
}
function buildDots(){
  $('dots').innerHTML=''; STEPS.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.title=`${i+1}. ${s.title}`; b.setAttribute('aria-label',b.title); b.onclick=()=>goTo(i); $('dots').appendChild(b); });
}
function refreshChrome(){
  [...$('dots').children].forEach((b,i)=>{ b.className=i===cur?'cur':(i<cur?'done':''); });
  $('count').textContent=`${cur+1} / ${STEPS.length}`; $('bar').style.width=`${((cur+1)/STEPS.length)*100}%`;
  $('prev').disabled=cur<=0; $('next').disabled=cur>=STEPS.length-1;
}
function goTo(i,instant=false){
  i=Math.max(0,Math.min(STEPS.length-1,i)); if(i===cur) return;
  cur=i; stepT=0; autoT=0; resetStage();
  const b=BEH[STEPS[i].id]; focus=new Set(b.focus);
  tgtPos.copy(b.cam.pos); tgtLook.copy(b.cam.look);
  userMoved=false; if(instant||snap||reduceMotion){ camPos.copy(tgtPos); camLook.copy(tgtLook); yaw=pitch=0; zoom=1; snap=false; }
  O.kmsKey.visible=focus.has('kms');
  buildPanel(i); refreshChrome();
  if(location.hash!==`#/${i+1}`) history.replaceState(null,'',`#/${i+1}`);
}
const next=()=>goTo(cur+1), prev=()=>goTo(cur-1);
function setAuto(on){ auto=on; autoT=0; $('auto').classList.toggle('on',on); $('auto').textContent=on?'⏸':'⏵'; }
$('next').onclick=()=>{next();}; $('prev').onclick=()=>{prev();};
$('auto').onclick=()=>setAuto(!auto);
$('reset').onclick=()=>{yaw=pitch=0;zoom=1;userMoved=false;};
$('toggle').onclick=()=>{ $('panel').classList.toggle('off'); viewOffset(); };
$('copy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('cmd').textContent); $('copy').textContent='Copiado ✔'; }catch{ $('copy').textContent='Selecciona y copia'; } };
addEventListener('keydown',(e)=>{
  if(e.target.closest&&e.target.closest('button')&&e.key===' ') return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key===' '){e.preventDefault();setAuto(!auto);}
  else if(e.key==='h'||e.key==='H'){$('toggle').click();}
  else if(e.key==='r'||e.key==='R'){$('reset').click();}
  else if(e.key==='Home'){goTo(0);} else if(e.key==='End'){goTo(STEPS.length-1);}
});
// órbita con el puntero
{ const cv=$('c'); let drag=false,lx=0,ly=0;
  cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.classList.add('drag');cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{ if(!drag) return; yaw-=(e.clientX-lx)*.005; pitch=Math.max(-.7,Math.min(.7,pitch-(e.clientY-ly)*.004)); lx=e.clientX;ly=e.clientY; userMoved=true; });
  const end=()=>{drag=false;cv.classList.remove('drag');}; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(.45,Math.min(1.8,zoom*Math.exp(e.deltaY*.001))); userMoved=true; },{passive:false}); }

/* ---------- bucle de render ---------- */
const lbTmp=V(), sphr=new THREE.Spherical(), off=V();
function updateLabels(){
  const W=innerWidth,H=innerHeight;
  for(const l of labels){
    const want = l.on && (l.kind==='zone' ? (focus.has('zones')||focus.has(l.group)) : focus.has(l.group));
    if(!want){ if(!l.hid){l.el.classList.add('hidden');l.hid=true;} continue; }
    lbTmp.copy(l.pos).project(camera);
    if(lbTmp.z>1||lbTmp.z<-1||Math.abs(lbTmp.x)>1.25||Math.abs(lbTmp.y)>1.25){ if(!l.hid){l.el.classList.add('hidden');l.hid=true;} continue; }
    l.el.style.transform=`translate(${(lbTmp.x*.5+.5)*W}px,${(-lbTmp.y*.5+.5)*H}px) ${l.anchor==='right'?'translate(0,-50%)':'translate(-50%,-100%)'}`;
    if(l.hid){l.el.classList.remove('hidden');l.hid=false;}
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; stepT+=dt;
  for(const f of idle) f(time,dt);
  const b=BEH[STEPS[cur].id]; b.tick(stepT,dt);
  if(auto){ autoT+=dt; if(autoT>(b.L||14)*1.0){ if(cur<STEPS.length-1) next(); else setAuto(false); } }
  const k=1-Math.exp(-dt*2.4); camPos.lerp(tgtPos,k); camLook.lerp(tgtLook,k);
  if(!userMoved){ yaw*=1-k; pitch*=1-k; zoom=lerp(zoom,1,k); }
  off.copy(camPos).sub(camLook); sphr.setFromVector3(off); sphr.theta+=yaw; sphr.phi=Math.max(.2,Math.min(1.5,sphr.phi+pitch)); sphr.radius*=zoom*(camera.aspect<1?1+(1-camera.aspect)*1.8:1); off.setFromSpherical(sphr);   // en pantallas estrechas la cámara se aleja
  camera.position.copy(camLook).add(off); camera.lookAt(camLook);
  camera.updateMatrixWorld();
  renderer.render(scene,camera); updateLabels();
  requestAnimationFrame(frame);
}

buildDots(); resize();
const startAt=Math.max(1,Math.min(STEPS.length,parseInt((location.hash.match(/#\/(\d+)/)||[])[1]||'1',10)))-1;
goTo(startAt,true);
stepT=Math.max(0,parseFloat(new URLSearchParams(location.search).get('t'))||0);   // ?t=SEGUNDOS: salta dentro de la animación del paso
addEventListener('hashchange',()=>{ const n=parseInt((location.hash.match(/#\/(\d+)/)||[])[1]||'0',10); if(n>=1&&n<=STEPS.length) goTo(n-1); });
requestAnimationFrame((n)=>{last=n;frame(n);});
window.__tour={goTo,get step(){return cur;},steps:STEPS.length};
</script>
