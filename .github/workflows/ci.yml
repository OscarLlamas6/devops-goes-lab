name: CI

on:
  pull_request:
    branches: [main]

# No GCP credentials here: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are stable on purpose: branch protection requires them by name.
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Files need gofmt:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
      - name: Build image (no push)
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t tramites-api:ci app
      - name: Trivy scan (fails on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tramites-api:ci
          severity: CRITICAL
          exit-code: "1"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      # -backend=false: validation needs no GCP credentials nor access to the remote state.
      - name: terraform init and validate in every root
        run: |
          for dir in infra/*/; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  security:
    runs-on: ubuntu-latest
    env:
      # The runner has no terraform binary (the `terraform` job covers fmt) and the checkout
      # is a detached merge commit, so the branch-name hook has no branch to validate.
      SKIP: terraform_fmt,check-branch-name
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the gitleaks scan covers every commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit==4.5.1
      # Same script developers run locally: installs gitleaks (pinned + checksum verified),
      # registers the hooks, scans the whole git history and the working tree with gitleaks,
      # and runs `pre-commit run --all-files` with the repo's own .pre-commit-config.yaml.
      # This job is what blocks the merge if someone skipped the local hooks.
      - name: Hooks, gitleaks history scan and pre-commit on all files
        run: ./scripts/setup-dev.sh --yes
      - name: Prove the secret barrier blocks fake secrets
        env:
          SKIP: "" # the job-level SKIP must not leak in: every hook has to be active for this test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          ./scripts/test-secret-hooks.sh
